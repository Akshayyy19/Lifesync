{% extends "base.html" %}
{% block title %}Password Updated · LifeSync{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card p-3 p-md-4 mt-4 shadow-sm border-0 text-center" style="border-radius: var(--radius-md); backdrop-filter: var(--glass-blur); background: var(--surface);">
      <div class="card-body">
        <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 text-success rounded-circle mb-3" style="width: 64px; height: 64px;">
          <i class="bi bi-shield-fill-check fs-2"></i>
        </div>

        <h1 class="h3 mb-2">Password Reset Complete</h1>
        <p class="text-muted-soft small mb-4">
          Your password has been changed successfully. You can now log into LifeSync with your new credentials.
        </p>

        <a href="{% url 'accounts:login' %}" class="btn btn-sky-cta w-100 py-2">
          <i class="bi bi-box-arrow-in-right me-1"></i> Log in to LifeSync
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
