{% extends "base.html" %}
{% block title %}Delete entry{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 mt-4">
      <div class="card-body">
        <h1 class="h4 mb-3"><i class="bi bi-exclamation-triangle text-danger"></i> Delete this entry?</h1>
        <p>Your diary entry from <strong>{{ entry.date|date:"d M Y" }}</strong> will be permanently deleted. This can't be undone.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Yes, delete it</button>
            <a href="{% url 'diary:detail' entry.pk %}" class="btn btn-outline-primary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
