{% extends "base.html" %}
{% block title %}{{ action }} diary entry{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card p-4 mt-2">
      <div class="card-body">
        <h1 class="h3 mb-4">{{ action }} diary entry</h1>

        <form method="post">
          {% csrf_token %}

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label" for="{{ form.date.id_for_label }}">Date</label>
              {{ form.date }}
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label" for="{{ form.mood.id_for_label }}">Mood</label>
              {{ form.mood }}
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="{{ form.title.id_for_label }}">Title</label>
            {{ form.title }}
          </div>

          <div class="mb-4">
            <label class="form-label" for="{{ form.content.id_for_label }}">What happened today?</label>
            {{ form.content }}
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-sky-cta">Save entry</button>
            <a href="{% url 'diary:list' %}" class="btn btn-outline-primary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
