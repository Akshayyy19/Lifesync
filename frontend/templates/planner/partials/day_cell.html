{% if day %}
<td class="{% if day.is_today %}today{% endif %} {% if day.other_month %}other-month{% endif %} position-relative">
  <a class="day-cell-link" href="{% url 'planner:day_detail' day.date.year day.date.month day.date.day %}">
    <div class="d-flex justify-content-between align-items-start mb-1 flex-shrink-0">
        <span class="day-number">{{ day.day }}</span>
        {% if day.weather_icon %}
        <span onclick="event.preventDefault(); event.stopPropagation(); window.location.href='{% url 'weather:index' %}';"
              class="day-wx text-decoration-none"
              title="{{ day.weather_description|default:day.weather_temp }}°C — click for weather"
              role="button">
            <img src="https://openweathermap.org/img/wn/{{ day.weather_icon }}.png" alt="weather" style="width:26px;height:26px;margin-top:-2px;opacity:0.9;">
            <span class="wx-temp">{{ day.weather_temp|floatformat:0 }}°</span>
        </span>
        {% endif %}
    </div>
    <div class="day-items-container">
      {% for item in day.items %}
      <span class="mini-chip {{ item.badge_class }}" data-category="{{ item.category }}">{{ item.title }}</span>
      {% endfor %}
    </div>
  </a>
</td>
{% else %}
<td class="empty-fill"></td>
{% endif %}
